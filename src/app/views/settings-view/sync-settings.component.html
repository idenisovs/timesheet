<section class="card">
	<div class="card-body">
		@if (isEditing) {
			<form [formGroup]="form" (ngSubmit)="save()">
				<label for="syncServiceUrl" class="form-label fw-semibold">Sync service URL</label>
				<input
					id="syncServiceUrl"
					type="url"
					class="form-control"
					formControlName="syncServiceUrl"
				>
				<button type="submit" class="btn btn-primary mt-3">Save</button>
			</form>
		} @else {
			<div class="fw-semibold">Sync service URL</div>
			<div class="border rounded bg-body-tertiary p-2 mt-2 text-break">
				{{ form.controls.syncServiceUrl.value || 'Not set' }}
			</div>
			<button type="button" class="btn btn-primary mt-3" (click)="edit()">Edit</button>
		}
	</div>
</section>
