<section class="card">
	<div class="card-body">
		<div class="fw-semibold">Timesheet Sync Service</div>
		<p class="text-muted mt-2 mb-0">
			Timesheet is designed to keep your data in your browser. Turn on sync to
			keep your timesheet data up to date with a remote (cloud) service.
		</p>
		@if (settings().isSyncServiceEnabled) {
			<button type="button" class="btn btn-outline-secondary mt-3" (click)="toggleSyncService()">
				Turn off sync
			</button>
		} @else {
			<button type="button" class="btn btn-primary mt-3" (click)="toggleSyncService()">
				Turn on sync
			</button>
		}
	</div>
</section>

@if (settings().isSyncServiceEnabled) {
	<app-sync-service-url />
}
