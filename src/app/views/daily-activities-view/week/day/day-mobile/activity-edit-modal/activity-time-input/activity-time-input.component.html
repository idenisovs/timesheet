<div class="row mt-2">
	<label [for]="fieldId()" class="col-4 col-form-label">{{ label() }}</label>
	<div class="col-6">
		<input
			type="time"
			[id]="fieldId()"
			class="form-control"
			[formControl]="control()"
		/>
	</div>
	<div class="col-2 p-0">
		<button
			type="button"
			class="btn btn-outline-secondary"
			(click)="openTimePicker()"
		>
			<i class="material-symbols-outlined">schedule</i>
		</button>
	</div>
</div>
