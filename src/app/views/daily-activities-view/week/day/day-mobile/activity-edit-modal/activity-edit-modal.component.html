<header class="modal-header px-3 py-2">
	<h4 class="modal-title text-primary">
		Activity
	</h4>
	<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</header>

<main class="modal-body p-3">
	<div class="d-flex gap-2">
		<div class="d-flex flex-column gap-3">
			<span class="badge text-bg-primary">12:00</span>
			<span class="badge text-bg-primary">12:05</span>
			<span class="badge text-bg-primary">12:10</span>
			<span class="badge text-bg-primary">12:15</span>
		</div>
		<div class="d-flex flex-column flex-grow-1 justify-content-around gap-2 w-100">
			@if (previousActivity) {
				<div class="card">
					<div class="card-body">
						{{previousActivity.name}}
					</div>
				</div>
			} @else {
				<div class="card text-bg-primary">
					<div class="card-body">
						Start of the Day
					</div>
				</div>
			}

			<div class="card">
				<div class="card-body">
					{{activity.name}}
				</div>
			</div>

			@if (nextActivity) {
				<div class="card">
					<div class="card-body">
						{{nextActivity.name}}
					</div>
				</div>
			} @else {
				<div class="card text-bg-primary">
					<div class="card-body">
						End of the Day
					</div>
				</div>
			}
		</div>
	</div>
</main>
