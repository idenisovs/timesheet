<header class="modal-header px-3 py-2">
	<h4 class="modal-title text-primary">
		Activity
	</h4>
	<button
		type="button"
		class="btn-close"
		aria-label="Close"
		(click)="cancel()"
	></button>
</header>

<main class="modal-body p-1">
	<div class="d-flex flex-column justify-content-between h-100">
		<app-adjacent-activity
			[time]="PreviousTime"
			[activity]="previousActivity"
			fallbackLabel="Start of the Day"
		/>

		<!-- The container of whole Activity Card -->
		<section class="flex-grow-1 py-2">
			<div class="d-flex flex-row">
				<!-- Expand the width of Activity Card container -->
				<div class="flex-grow-1">
					<article class="card" [style.border-color]="activity.color">
						<div class="card-body">
							<!-- Name -->
							<div class="row">
								<label for="name" class="col-4 col-form-label">Name</label>
								<div class="col-8">
									<textarea
										id="name"
										class="form-control"
										rows="2"
										[formControl]="activityFormItem.controls.name"
									></textarea>
								</div>
							</div>
							<!-- Time From -->
							<div class="row mt-2">
								<label for="time-from" class="col-4 col-form-label">From</label>
								<div class="col-6">
									<input
										type="time"
										id="time-from"
										class="form-control"
										[formControl]="activityFormItem.controls.from"
									/>
								</div>
								<div class="col-2 p-0">
									<button
										type="button"
										class="btn btn-outline-secondary"
										(click)="openTimePicker('from')"
									>
										<i class="material-symbols-outlined">schedule</i>
									</button>
								</div>
							</div>
							<!-- Time Till -->
							<div class="row mt-2">
								<label for="time-till" class="col-4 col-form-label">Till</label>
								<div class="col-6">
									<input
										type="time"
										id="time-till"
										class="form-control"
										[formControl]="activityFormItem.controls.till"
									/>
								</div>
								<div class="col-2 p-0">
									<button
										type="button"
										class="btn btn-outline-secondary"
										(click)="openTimePicker('till')"
									>
										<i class="material-symbols-outlined">schedule</i>
									</button>
								</div>
							</div>
							<!-- Duration -->
							<div class="row mt-2">
								<label for="time-duration" class="col-4 col-form-label">Duration</label>
								<div class="col-8">
									<input
										type="text"
										readonly
										class="form-control-plaintext"
										id="time-duration"
										[formControl]="activityFormItem.controls.duration"
									/>
								</div>
							</div>
						</div>
					</article>
				</div>
			</div>
		</section>

		<app-adjacent-activity
			[time]="NextTime"
			[activity]="nextActivity"
			fallbackLabel="End of the Day"
		/>
	</div>
</main>

<footer class="modal-footer">
	<button type="button" class="btn btn-outline-primary" (click)="save()">
		<i class="material-symbols-outlined">save</i> Save
	</button>

	<button type="button" class="btn btn-outline-secondary" (click)="cancel()">
		<i class="material-symbols-outlined">cancel</i> Cancel
	</button>
</footer>
