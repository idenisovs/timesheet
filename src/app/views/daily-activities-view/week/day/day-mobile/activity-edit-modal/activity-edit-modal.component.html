<header class="modal-header px-3 py-2">
	<h4 class="modal-title text-primary">
		Activity
	</h4>
	<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</header>

<main class="modal-body p-1">
	<div class="d-flex flex-column justify-content-between h-100">
		<app-adjacent-activity
			[time]="PreviousTime"
			[activity]="previousActivity"
			fallbackLabel="Start of the Day"
		/>

		<!-- The container of whole Activity Card-->
		<section #cardContainer class="flex-grow-1 py-2">
			<div class="d-flex flex-row">
				<!-- Expand the width of Activity Card container -->
				<div class="flex-grow-1">
					<article class="card">
						<div class="card-body">
							<!-- Time From -->
							<div class="row mb-2">
								<label for="time-from" class="col-3 col-form-label">From</label>
								<div class="col-7">
									<app-time-picker id="time-from"/>
								</div>
								<div class="col-2 p-0">
									<button type="button" class="btn btn-outline-secondary">
										<i class="material-symbols-outlined">schedule</i>
									</button>
								</div>
							</div>
							<!-- Time Till -->
							<div class="row">
								<label for="time-from" class="col-3 col-form-label">Till</label>
								<div class="col-7">
									<app-time-picker id="time-till"/>
								</div>
								<div class="col-2 p-0">
									<button type="button" class="btn btn-outline-secondary">
										<i class="material-symbols-outlined">schedule</i>
									</button>
								</div>
							</div>
						</div>
					</article>
				</div>
			</div>
		</section>

		<app-adjacent-activity
			[time]="NextTime"
			[activity]="nextActivity"
			fallbackLabel="End of the Day"
		/>
	</div>
</main>
