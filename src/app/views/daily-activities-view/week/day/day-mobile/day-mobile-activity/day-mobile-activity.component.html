<div class="card h-100" [style]="{'border-color': activity().color, 'background-color': subtleColor(activity().color)}">
	<div class="card-body d-flex">
		<div class="d-flex flex-grow-1 justify-content-between align-self-center">
			<div>
				@if (activity().hasIssueKey()) {
					<div class="d-inline fw-bold" [style]="{'color': activity().color}">
						{{activity().getIssueKey()}}
					</div>
				}
				<div>{{activity().getShortName()}}</div>
			</div>
			@if (activity().duration) {
				<div class="text-nowrap fw-bold" [style]="{'color': activity().color}">
					{{ activity().duration }}
				</div>
			}
		</div>
	</div>
</div>
